# Deploys the game to the `sky-jump` Cloudflare Pages project (direct upload, same as `npm run deploy:pages`) on every push to `live`.
# INERT until you add two repository secrets (Settings > Secrets and variables > Actions): CLOUDFLARE_API_TOKEN (Pages:Edit) and CLOUDFLARE_ACCOUNT_ID.
# Without them the job just prints how to enable it and succeeds, so pushes never go red. Run manually from the Actions tab with "Run workflow".
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [live]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare secrets
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::Deploy skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable auto-deploy."; fi
      - uses: actions/setup-node@v4
        if: steps.cf.outputs.ready == 'true'
        with: { node-version: 22 }
      - name: Build cf-public and deploy
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --no-audit --no-fund
          npm run deploy:pages
